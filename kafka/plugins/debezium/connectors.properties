
name=demo_connector

connector.class=io.debezium.connector.cassandra.Cassandra3Connector

commit.log.relocation.dir=/home/santosh/docker_setup/kafka/plugins/debezium/test_dir/relocation
offset.backing.store.dir=/home/santosh/docker_setup/kafka/plugins/debezium/test_dir

http.port=8000
cassandra.commitlog.location=/home/santosh/docker_setup/casendra_cdc/data/cdc_raw

cassandra.config=/home/santosh/docker_setup/casendra_cdc/apache-cassandra-5.0.4/conf/cassandra.yaml
cassandra.hosts=localhost
cassandra.port=9042
cassandra.keyspace=my_keyspace

kafka.producer.bootstrap.servers=localhost:9092
kafka.producer.retries=3
kafka.producer.retry.backoff.ms=1000

topic.prefix=cassandra

key.converter=org.apache.kafka.connect.json.JsonConverter
key.converter.schemas.enable=false

value.converter=org.apache.kafka.connect.json.JsonConverter
value.converter.schemas.enable=false

snapshot.consistency=ONE
snapshot.mode=ALWAYS
latest.commit.log.only=true
cassandra.schema.listener.class=io.debezium.connector.cassandra.Cassandra3SchemaChangeListener
cassandra.protocol.version:V4
tasks.max=1
